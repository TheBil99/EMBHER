[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embher"
version = "0.2.0"
description = "Heritability estimation from kernels (exact REML, Haseman-Elston) and embedding capture, attribution and whitening for sequence-to-function models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Miquel Anglada-Girotto"},
    {name = "Federico Billeci"},
]
# Core = both parts' basic tools: heritability (numpy, pandas, scipy) and the embedding
# tools that need no model (whitening, gene metadata, regions/reductions, HDF5 reading and
# inspection). No torch, no jax.
dependencies = ["numpy", "pandas", "scipy", "pyarrow", "pysam", "pyyaml", "tqdm", "h5py", "ml_dtypes", "numba"]

[project.optional-dependencies]
# Borzoi/Flashzoi forward passes (embher-capture --model_type borzoi)
capture-borzoi = ["torch", "borzoi-pytorch"]
# Enformer forward passes (embher.embedding.backends)
capture-enformer = ["torch", "enformer-pytorch"]
# AlphaGenome forward passes. jax, haiku, orbax, jmp and alphagenome_research are also
# needed; alphagenome_research is not on PyPI (github.com/google-deepmind/alphagenome_research).
# Keep it in its own environment: the jax and torch stacks are disjoint.
capture-alphagenome = ["alphagenome"]
# Attribution (Borzoi only)
# decima: only decima.core.attribution.Attribution is used (unchanged from 0.6.2 on). 0.7.1+ sets cuDNN
# deterministic mode when `decima` is imported; envs that must match the paper's runs use decima==0.7.0.
attribution = ["embher[capture-borzoi]", "captum", "tangermeme", "decima>=0.6.2", "pyBigWig"]
dev = ["pytest", "pytest-cov"]
# Everything except AlphaGenome
all = ["embher[capture-borzoi,capture-enformer,attribution,dev]"]

[project.scripts]
embher-h2 = "embher.cli.h2:main"
embher-kernel = "embher.cli.kernel:main"
embher-capture = "embher.embedding.cli.capture_forward:main"
embher-attribute = "embher.embedding.cli.attribute_layers:main"
embher-inspect-h5 = "embher.embedding.cli.inspect_h5:main"
embher-prepare-gene-meta = "embher.embedding.cli.prepare_gene_meta:main"

[tool.setuptools.packages.find]
include = ["embher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
