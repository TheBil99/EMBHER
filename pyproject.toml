[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emage"
version = "0.1.0"
description = "Exact REML / Haseman-Elston heritability estimation, GRM construction and embedding whitening"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy"]

[tool.setuptools]
packages = ["emage"]
